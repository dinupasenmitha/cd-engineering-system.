<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CD Engineering Enterprises — Air Conditioning Business Management System">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>CD Engineering — Management System</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- ═══ LOGIN SCREEN ═══ -->
  <div id="login-screen" class="login-screen" style="display:flex">
    <div class="login-card">
      <div class="login-logo">
        <div class="sidebar-logo" style="width:64px;height:64px;font-size:22px;margin:0 auto 16px">CD</div>
        <h1>CD Engineering</h1>
        <p>Enterprises (PVT) Ltd — Management System</p>
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <div class="form-group">
        <label>Username</label>
        <input class="form-control" type="text" id="login-username" placeholder="Enter username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary login-submit" id="login-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
      <div class="login-footer">Secure login • Session expires after 20 minutes of inactivity</div>
    </div>
  </div>

  <!-- ═══ APP SHELL (hidden until login) ═══ -->
  <div id="app-shell" style="display:none">
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">CD</div>
          <div class="sidebar-company">CD Engineering</div>
          <div class="sidebar-subtitle">Enterprises (PVT) Ltd</div>
        </div>

        <!-- User Info -->
        <div class="sidebar-user">
          <div class="user-avatar" id="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="user-info">
            <div id="user-display-name" class="user-name">User</div>
            <span id="user-role-badge" class="role-badge role-staff">Staff</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item active" data-page="dashboard" id="nav-dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </button>
          <button class="nav-item" data-page="customers" id="nav-customers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Customers
          </button>
          <button class="nav-item" data-page="jobs" id="nav-jobs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Jobs
          </button>
          <button class="nav-item" data-page="fleet" id="nav-fleet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            Fleet
          </button>
          <button class="nav-item" data-page="pricing" id="nav-pricing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Pricing
          </button>
          <button class="nav-item" data-page="invoices" id="nav-invoices">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            Invoices
          </button>
          <button class="nav-item" data-page="documents" id="nav-documents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            Documents
          </button>
          <button class="nav-item" data-page="technicians" id="nav-technicians">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Technicians
          </button>
          <button class="nav-item" data-page="catalog" id="nav-catalog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Catalog
          </button>
          <button class="nav-item" data-page="settings" id="nav-settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
          </button>
        </nav>
        <div class="sidebar-footer">
          <button class="dark-toggle" id="darkToggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span id="darkLabel">Dark Mode</span>
          </button>
          <button class="dark-toggle" id="logout-btn" style="color:var(--danger)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
          <small>&copy; 2026 CD Engineering</small>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Quick Calculator Floating Widget -->
  <button id="calc-fab" class="calc-fab" onclick="APP.Calculator.toggle()" title="Quick Calculator">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="16" y1="18" x2="16" y2="18.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="12" y1="18" x2="12" y2="18.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="8" y1="18" x2="8" y2="18.01"/></svg>
  </button>
  <div id="calc-widget" class="calc-widget">
    <div class="calc-header">
      <h4>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="vertical-align:-2px;margin-right:6px"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg>
        Quick Calculator
      </h4>
      <div style="display:flex;gap:4px;align-items:center">
        <button onclick="APP.Calculator.copyResult()" title="Copy result" style="font-size:14px;padding:2px 6px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button onclick="APP.Calculator.toggle()" title="Close" style="font-size:20px">×</button>
      </div>
    </div>
    <div class="calc-expression" id="calc-expression"></div>
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-keys">
      <button onclick="APP.Calculator.input('C')" class="calc-clear">C</button>
      <button onclick="APP.Calculator.input('BS')" class="calc-clear" title="Backspace">⌫</button>
      <button onclick="APP.Calculator.input('%')">%</button>
      <button onclick="APP.Calculator.input('/')" class="calc-op">÷</button>
      
      <button onclick="APP.Calculator.input('7')">7</button>
      <button onclick="APP.Calculator.input('8')">8</button>
      <button onclick="APP.Calculator.input('9')">9</button>
      <button onclick="APP.Calculator.input('*')" class="calc-op">×</button>
      
      <button onclick="APP.Calculator.input('4')">4</button>
      <button onclick="APP.Calculator.input('5')">5</button>
      <button onclick="APP.Calculator.input('6')">6</button>
      <button onclick="APP.Calculator.input('-')" class="calc-op">−</button>
      
      <button onclick="APP.Calculator.input('1')">1</button>
      <button onclick="APP.Calculator.input('2')">2</button>
      <button onclick="APP.Calculator.input('3')">3</button>
      <button onclick="APP.Calculator.input('+')" class="calc-op">+</button>
      
      <button onclick="APP.Calculator.input('0')" style="grid-column: span 2">0</button>
      <button onclick="APP.Calculator.input('.')">.</button>
      <button onclick="APP.Calculator.input('=')" class="calc-equal">=</button>
    </div>
    <div class="calc-history-section">
      <div class="calc-history-header">
        <span>History</span>
        <button onclick="APP.Calculator.clearHistory()" title="Clear history" style="font-size:11px;background:none;border:none;color:var(--gray-400);cursor:pointer">Clear</button>
      </div>
      <div class="calc-history" id="calc-history">
        <div style="text-align:center;color:var(--gray-400);font-size:12px;padding:12px">No history yet</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="modules/store.js"></script>
  <script src="modules/calculator.js"></script>
  <script src="modules/fleet.js"></script>
  <script src="modules/catalog.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/customers.js"></script>
  <script src="modules/jobs.js"></script>
  <script src="modules/pricing.js"></script>
  <script src="modules/invoices.js"></script>
  <script src="modules/documents.js"></script>
  <script src="modules/technicians.js"></script>
  <script src="modules/settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
